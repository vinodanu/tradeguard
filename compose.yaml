name: tradeguard
x-app: &app
  restart: unless-stopped
  environment: &app-env
    KAFKA_SERVERS: kafka:9092
    JWT_PUBLIC_KEY: /run/secrets/public.pem
  volumes:
    - ./secrets/public.pem:/run/secrets/public.pem:ro
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  mysql:
    image: mysql:8.4.7
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run bootstrap}
      TRADE_DB_PASSWORD: ${TRADE_DB_PASSWORD}
      CASE_DB_PASSWORD: ${CASE_DB_PASSWORD}
    command: ["--innodb-buffer-pool-size=128M", "--max-connections=40"]
    volumes: ["mysql-data:/var/lib/mysql", "./infra/mysql-init.sh:/docker-entrypoint-initdb.d/01-users.sh:ro"]
    healthcheck: {test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost --silent"], interval: 5s, timeout: 5s, retries: 40}
    mem_limit: 768m
  mongo:
    image: mongo:8.0.15
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    entrypoint: ["bash", "-c", "cp /run/secrets/mongo-key /tmp/mongo-key && chown mongodb:mongodb /tmp/mongo-key && chmod 400 /tmp/mongo-key && exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongo-key --wiredTigerCacheSizeGB 0.25"]
    volumes: ["mongo-data:/data/db", "./secrets/mongo-key:/run/secrets/mongo-key:ro"]
    healthcheck: {test: ["CMD-SHELL", "mongosh --quiet --username root --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ping:1})'"], interval: 5s, timeout: 10s, retries: 40}
    mem_limit: 768m
  mongo-init:
    image: mongo:8.0.15
    depends_on: {mongo: {condition: service_healthy}}
    environment:
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      COMPLIANCE_DB_PASSWORD: ${COMPLIANCE_DB_PASSWORD}
      LIVE_DB_PASSWORD: ${LIVE_DB_PASSWORD}
    volumes: ["./infra/mongo-init.js:/init.js:ro"]
    entrypoint: ["mongosh", "--host", "mongo", "--username", "root", "--password", "${MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "/init.js"]
  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_RETENTION_BYTES: 104857600
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck: {test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"], interval: 10s, timeout: 10s, retries: 30}
    mem_limit: 1g
  kafka-init:
    image: apache/kafka:4.0.0
    depends_on: {kafka: {condition: service_healthy}}
    volumes: ["./infra/kafka-init.sh:/init.sh:ro"]
    entrypoint: ["bash", "/init.sh"]
  trade-service:
    <<: *app
    build: {context: ., args: {SERVICE: trade-service}}
    image: ${IMAGE_PREFIX:-tradeguard}/trade-service:${IMAGE_TAG:-local}
    environment:
      <<: *app-env
      MYSQL_URL: jdbc:mysql://mysql:3306/trade
      MYSQL_USER: trade
      MYSQL_PASSWORD: ${TRADE_DB_PASSWORD}
      JWT_PRIVATE_KEY: /run/secrets/private.pem
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      COMPLIANCE_URL: http://compliance-service:8082
    depends_on: {mysql: {condition: service_healthy}, kafka-init: {condition: service_completed_successfully}}
    volumes: ["./secrets/public.pem:/run/secrets/public.pem:ro", "./secrets/private.pem:/run/secrets/private.pem:ro"]
    mem_limit: 768m
    healthcheck: {test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8081'"], interval: 10s, timeout: 5s, retries: 30, start_period: 30s}
  compliance-service:
    <<: *app
    build: {context: ., args: {SERVICE: compliance-service}}
    image: ${IMAGE_PREFIX:-tradeguard}/compliance-service:${IMAGE_TAG:-local}
    environment:
      <<: *app-env
      MONGO_URI: mongodb://compliance:${COMPLIANCE_DB_PASSWORD}@mongo:27017/compliance?replicaSet=rs0&authSource=compliance
    depends_on: {mongo-init: {condition: service_completed_successfully}, kafka-init: {condition: service_completed_successfully}}
    mem_limit: 768m
    healthcheck: {test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8082'"], interval: 10s, timeout: 5s, retries: 30, start_period: 30s}
  investigation-service:
    <<: *app
    build: {context: ., args: {SERVICE: investigation-service}}
    image: ${IMAGE_PREFIX:-tradeguard}/investigation-service:${IMAGE_TAG:-local}
    environment:
      <<: *app-env
      MYSQL_URL: jdbc:mysql://mysql:3306/investigation
      MYSQL_USER: investigation
      MYSQL_PASSWORD: ${CASE_DB_PASSWORD}
    depends_on: {mysql: {condition: service_healthy}, kafka-init: {condition: service_completed_successfully}}
    mem_limit: 768m
    healthcheck: {test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8083'"], interval: 10s, timeout: 5s, retries: 30, start_period: 30s}
  live-view-service:
    <<: *app
    build: {context: ., args: {SERVICE: live-view-service}}
    image: ${IMAGE_PREFIX:-tradeguard}/live-view-service:${IMAGE_TAG:-local}
    environment:
      <<: *app-env
      MONGO_URI: mongodb://liveview:${LIVE_DB_PASSWORD}@mongo:27017/liveview?replicaSet=rs0&authSource=liveview
    depends_on: {mongo-init: {condition: service_completed_successfully}, kafka-init: {condition: service_completed_successfully}}
    mem_limit: 768m
    healthcheck: {test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8084'"], interval: 10s, timeout: 5s, retries: 30, start_period: 30s}
  web:
    build: ./frontend
    image: ${IMAGE_PREFIX:-tradeguard}/web:${IMAGE_TAG:-local}
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      trade-service: {condition: service_healthy}
      compliance-service: {condition: service_healthy}
      investigation-service: {condition: service_healthy}
      live-view-service: {condition: service_healthy}
    mem_limit: 128m
volumes:
  mysql-data:
  mongo-data:
  kafka-data:
