limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
server {
 listen 443 ssl;
 ssl_certificate /etc/letsencrypt/live/tradeguard/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/tradeguard/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 server_name _;
 root /usr/share/nginx/html;
 client_max_body_size 150k;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
 location = /api/v1/auth/login { limit_req zone=login burst=5 nodelay; proxy_pass http://trade-service:8081; }
 location = /api/v1/stream { proxy_pass http://live-view-service:8084; proxy_buffering off; proxy_cache off; proxy_read_timeout 1000s; }
 location = /api/v1/dashboard { proxy_pass http://live-view-service:8084; }
 location = /api/v1/orders { if ($request_method = GET) { proxy_pass http://live-view-service:8084; } proxy_pass http://trade-service:8081; }
 location /api/v1/orders/ { proxy_pass http://trade-service:8081; }
 location /api/v1/portfolios { proxy_pass http://trade-service:8081; }
 location /api/v1/executions/ { proxy_pass http://trade-service:8081; }
 location /api/v1/instruments { proxy_pass http://compliance-service:8082; }
 location /api/v1/evaluations/ { proxy_pass http://compliance-service:8082; }
 location /api/v1/rulesets { proxy_pass http://compliance-service:8082; }
 location /api/v1/cases { proxy_pass http://investigation-service:8083; }
 location /api/v1/operations/ { proxy_pass http://live-view-service:8084; }
 location /api/ { return 404; }
 location / { try_files $uri /index.html; }
}

server {
 listen 80;
 server_name _;
 location /.well-known/acme-challenge/ { root /var/www/acme; }
 location / { return 301 https://$host$request_uri; }
}
