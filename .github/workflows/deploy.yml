name: Deploy gated AWS demo
on:
  workflow_dispatch:
    inputs:
      image_tag: {description: 'Verified 40-character commit SHA', required: true}
      cost_gate_confirmed: {description: 'Billing, memory, and teardown checks passed', type: boolean, default: false}
permissions: {contents: read, id-token: write}
jobs:
  deploy:
    if: inputs.cost_gate_confirmed
    environment: aws-demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: {role-to-assume: '${{ vars.AWS_DEPLOY_ROLE }}', aws-region: '${{ vars.AWS_REGION }}'}
      - name: Deploy over Systems Manager
        env: {INSTANCE: '${{ vars.AWS_INSTANCE_ID }}', TAG: '${{ inputs.image_tag }}', PREFIX: 'ghcr.io/${{ github.repository }}'}
        run: |
          [[ "$TAG" =~ ^[a-f0-9]{40}$ ]]
          export PREFIX="${PREFIX,,}"
          python3 - <<'PY'
          import json,os
          tag=os.environ['TAG'];prefix=os.environ['PREFIX']
          command=f"set -e; cd /opt/tradeguard; git fetch origin {tag}; git checkout {tag}; export IMAGE_PREFIX={prefix} IMAGE_TAG={tag}; docker compose -f compose.yaml -f compose.aws.yaml pull; docker compose -f compose.yaml -f compose.aws.yaml up -d --no-build --wait --wait-timeout 300"
          open('command.json','w').write(json.dumps({'commands':[command]}))
          PY
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript --parameters file://command.json --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE"
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE" --query Status --output text)
          test "$STATUS" = Success
