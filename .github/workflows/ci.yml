name: Verify TradeGuard
on: [push, pull_request]
permissions: {contents: read}
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn -B -ntp verify
      - run: mvn -B -ntp -Pintegration verify
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - working-directory: contracts
        run: npm ci && npm test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - working-directory: frontend
        run: npm ci && npm run build && npm test && npx playwright install --with-deps chromium && npm run e2e
  compose-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install cryptography==46.0.3 jsonschema==4.25.1
      - run: python scripts/check_linux_files.py
      - run: python scripts/test_client.py
      - run: python scripts/bootstrap.py && docker compose up --build -d --wait --wait-timeout 600
      - run: python scripts/acceptance.py --recovery
      - if: always()
        run: docker compose down -v
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: '1.13.4'}
      - working-directory: infra/aws
        run: terraform init -backend=false && terraform fmt -check && terraform validate
